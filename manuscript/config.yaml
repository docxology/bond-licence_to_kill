# Canonical ROGUE analysis parameters.
#
# READ THIS BEFORE EDITING. The *executable* source of truth is the set of
# `canonical_*_params()` functions in the pure domain core:
#
#   laundering    → src/licence_to_kill/laundering_graph.py
#   vessel        → src/licence_to_kill/vessel_forensics.py
#   rogue         → src/licence_to_kill/rogue_ops.py
#   finance       → src/licence_to_kill/narcotics_finance.py
#   logistics     → src/licence_to_kill/operations_logistics.py
#   surveillance  → src/licence_to_kill/surveillance.py
#
# The domain core is deliberately dependency-free (stdlib + numpy) and does
# NOT read YAML, so this block is the *declared mirror* of those functions,
# not their input. It is not decorative: every key below is asserted equal to
# the corresponding canonical value by tests/test_canonical_params.py, which
# fails the suite if the two ever drift. Change the Python first, then this
# block.
mission:
  film: "licence_to_kill"
  codename: "ROGUE"
  seed: 0
  laundering:
    sources: ["S1", "S2", "S3"]
    sinks: ["B1", "B2", "B3", "B4"]
    max_depth: 8
    max_cycles: 50
    max_paths: 1000
    funnel_threshold: 1.5
  vessel:
    profile: "Wavekrest"
    cargo_volume_m3: 520.0
    block_coefficient: 0.62
    max_speed_knots: 12.5
    observed:
      cargo_mass_t: 900.0
      declared_displacement_t: 700.0
  rogue:
    horizon: 10
    alert_max: 10
    exposure_cap: 20
    actions: ["stealth", "covert", "overt"]
  finance:
    value_usd: 5000000.0
    denomination: 100.0
    purity: 0.6
    base_cost_per_kg: 1500.0
    hold_volume_m3: 520.0
    hold_mass_kg: 300000.0
    stages: ["export", "wholesale", "street"]
  logistics:
    origin: "IC"
    destination: "FL"
    capacity_kg: 25.0
    speed_knots: 10.0
    endurance_nm: 4257.0
    refuel_hours: 24.0
  surveillance:
    actions: 5
    detection_threshold: 0.5
    beta_0: -4.0
    beta_watch: 1.2
    beta_signature: 1.5
    exact_limit: 8
