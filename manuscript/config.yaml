# licence_to_kill — Licence to Kill (1989) · mission codename ROGUE
# PROJECT BOND film package: deterministic special-agent mission software.
# Loaded by scripts/z_generate_manuscript_variables.py (via
# src/licence_to_kill/manuscript_variables.py) to hydrate manuscript tokens.

paper:
  title: "Licence to Kill: ROGUE — Special-Agent Mission Software for Money-Laundering, Vessel-Forensic, and Rogue-Operation Analysis"
  subtitle: "Deterministic graph, physics, and dynamic-programming modelling of an unsanctioned operation"
  version: "0.1.0"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

# Local-only tree: no remote, no DOIs. Publication metadata is deliberately
# minimal; the package is never pushed or deposited.
publication:
  github_repository: ""
  repository_url: ""
  journal: ""
  volume: ""
  pages: ""
  year: "2026"

keywords:
  - "money laundering detection"
  - "layering"
  - "integration"
  - "financial-flow graph"
  - "vessel forensics"
  - "gross tonnage"
  - "marine physics"
  - "rogue operations"
  - "escalation"
  - "blowback"
  - "dynamic programming"
  - "deterministic modelling"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

# Render format toggles (kept for parity with sibling film packages).
render:
  formats:
    pdf: true
    html: true
    slides: true
    docx: true
    epub: true

testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Canonical ROGUE analysis parameters — the single declarative source the
# core modules and manuscript variables draw from.
mission:
  film: "licence_to_kill"
  codename: "ROGUE"
  seed: 0
  laundering:
    sources: ["S1", "S2", "S3"]
    sinks: ["B1", "B2", "B3", "B4"]
    max_depth: 8
    max_cycles: 50
    max_paths: 200
  vessel:
    profile: "Wavekrest"
    observed:
      cargo_mass_t: 900.0
      declared_displacement_t: 700.0
  rogue:
    horizon: 10
    alert_max: 10
    actions: ["stealth", "covert", "overt"]
