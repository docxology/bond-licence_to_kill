# licence_to_kill — Licence to Kill (1989) · mission codename ROGUE
# PROJECT BOND film package. Implements the FROZEN bond-api MissionProvider
# contract and a pure deterministic domain core for the Sanchez money-
# laundering graph, Wavekrest-class vessel forensics, the rogue-00 revoked-
# licence risk model, narcotics-finance economics, operations logistics, and
# surveillance.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "licence_to_kill"
version = "0.1.0"
license = {text = "MIT"}
description = "Licence to Kill: ROGUE — special-agent mission software (money-laundering graph, vessel forensics, rogue-00 risk model, narcotics-finance economics, operations logistics, surveillance)"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

# Bond-api is the FROZEN protocol contract; all film packages bind to it via
# a local path dependency. The path below is machine-specific: point it at a
# local bond-api checkout before `uv sync` / `uv lock`.
[tool.uv.sources]
bond-api = { path = "/Users/4d/Documents/GitHub/template/projects/working/bond/bond-api" }

[tool.ruff]
# The package is authored and formatted at 120 columns with ruff's historical
# default lint set. Modern ruff defaults are 88 columns with a much wider rule
# set, which fails the documented gate on code nobody reformatted — so both
# are stated here instead of being inherited from whatever ruff version is
# installed. Widening the rule set / narrowing the width is a deliberate
# whole-tree migration, not a side effect of a tool upgrade.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate; the live measured coverage % is recorded
# with its date in TODO.md (do not hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Project-local mypy settings (the monorepo root config has no mypy_path for
# this package's src/ layout). Mirrors the bond-api build: strict-ish typing,
# explicit package bases, ignore missing stubs.
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true
