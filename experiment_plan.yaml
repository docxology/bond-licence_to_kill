# ROGUE experiment plan — validation inputs only; declares the deterministic runs.
project: licence_to_kill
codename: ROGUE

runs:
  - name: laundering
    module: laundering_graph
    inputs:
      seed: 0
      sources: ["S1", "S2", "S3"]
      sinks: ["B1", "B2", "B3", "B4"]
    outputs: [layering_score, integration_score, mixing_entropy, num_cycles, num_funnels, num_layering_paths]
  - name: vessel
    module: vessel_forensics
    inputs:
      profile: Wavekrest
      observed: {cargo_mass_t: 900.0, declared_displacement_t: 700.0}
    outputs: [gross_tonnage, endurance_nm, num_anomalies, anomaly_score]
  - name: rogue
    module: rogue_ops
    inputs: {horizon: 10, alert_max: 10}
    outputs: [optimal_value, first_action, peak_blowback]
  - name: finance
    module: narcotics_finance
    inputs:
      value_usd: 5000000.0
      denomination: 100.0
      purity: 0.6
      base_cost_per_kg: 1500.0
      stages:
        export: 3.0
        wholesale: 2.0
        street: 2.0
      hold_volume_m3: 520.0
      hold_mass_kg: 300000.0
    outputs: [bills, mass_kg, volume_m3, street_per_pure_gram, "manifest.feasible", trips]
  - name: logistics
    module: operations_logistics
    inputs: {origin: IC, destination: FL, legs: 5, gadgets: 7, capacity_kg: 25.0, speed_knots: 10.0, endurance_nm: 4257.0, refuel_hours: 24.0}
    outputs: ["route.total_distance_nm", "route.cumulative_risk", "loadout.value", "loadout.weight_kg", "trip.feasible", "trip.total_hours", "trip.refuels"]
  - name: surveillance
    module: surveillance
    inputs: {actions: 5, detection_threshold: 0.5, beta_0: -4.0, beta_watch: 1.2, beta_signature: 1.5, exact_limit: 8}
    outputs: [optimal_order, success_probability, compromise_step, peak_hazard]

primary_metrics:
  - layering_score
  - integration_score
  - optimal_expected_value

baseline: canonical seeded network and canonical Wavekrest-class profile
ablation: seed sensitivity (same structure, different seed changes amounts)
