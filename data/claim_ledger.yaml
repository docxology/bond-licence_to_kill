# Sourced numeric/algorithmic claims registered for evidence validation.
# Each row names the claim, its source, and where it is used.
claims:
  - id: imo-gross-tonnage
    source: IMO 1969 Convention on Tonnage Measurement
    value: "GT = (0.2 + 0.02 * log10 V) * V"
    used_in: vessel_forensics.gross_tonnage
  - id: seawater-density
    source: standard seawater density
    value: "1.025 t/m^3"
    used_in: vessel_forensics.displacement_from_draft
  - id: diesel-sfc
    source: marine diesel brake specific fuel consumption
    value: "0.195 kg/kWh"
    used_in: vessel_forensics.fuel_consumption_kgph
  - id: df-cycle-enumeration
    source: Tarjan 1972 depth-first search
    value: "elementary-cycle enumeration by depth-limited DFS"
    used_in: laundering_graph.find_cycles
  - id: backward-induction
    source: Bellman 1957 dynamic programming
    value: "exact finite-horizon optimal policy via backward induction"
    used_in: rogue_ops.solve_optimal_policy
